name: Prix des enchères

on:
  schedule:
    # Toutes les 15 minutes pendant les heures utiles en France.
    - cron: "*/15 5-20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Contrôler les prix sur chaque fiche officielle
        run: python3 -m scraper.prix

      - name: Publier les prix vérifiés
        run: |
          git config user.name "veille-hightech[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/lots.json
          if git diff --staged --quiet; then
            echo "aucun changement de prix"
            exit 0
          fi
          git commit -m "Prix vérifiés du $(date -u +%Y-%m-%d\ %H:%M) UTC"
          for essai in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploiement:
    needs: prix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
