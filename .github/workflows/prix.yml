name: Prix des enchères

on:
  schedule:
    # Toutes les 15 minutes pendant les heures utiles en France.
    - cron: "*/15 5-20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Contrôler les prix sur chaque fiche officielle
        run: python3 -m scraper.prix

      # Le fichier rafraîchi est publié dans l'artefact Pages sans créer un
      # commit toutes les 15 minutes. La collecte complète conserve les prix
      # dans Git lors de ses passages habituels.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploiement:
    needs: prix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
